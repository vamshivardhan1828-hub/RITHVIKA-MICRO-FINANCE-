<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rithvika Micro Finance</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0b1e4b"><link rel="apple-touch-icon" href="icon.png"><link rel="icon" href="icon.png"><meta name="theme-color" content="#1e1b5e">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--bg:#f1f5f9;--card:#fff;--tx:#0f172a;--mu:#64748b;--pr:#0f766e;--bd:#cbd5e1;--rd:#dc2626}
@media(prefers-color-scheme:dark){:root{--bg:#0b1220;--card:#162033;--tx:#e2e8f0;--mu:#94a3b8;--pr:#14b8a6;--bd:#334155}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px system-ui,sans-serif;padding-bottom:70px}
.w{max-width:640px;margin:auto;padding:14px}
.c{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px #0002}
h2{margin:0 0 10px;font-size:18px}h3{margin:0 0 6px;font-size:15px}
input,select,textarea{width:100%;padding:11px;margin:4px 0 10px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font-size:15px}
label{font-size:13px;color:var(--mu)}
button{background:var(--pr);color:#fff;border:0;border-radius:10px;padding:11px 14px;font-size:15px;cursor:pointer}
button.s{background:transparent;color:var(--pr);border:1px solid var(--pr)}button.sm{padding:6px 10px;font-size:13px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}.k{font-size:22px;font-weight:700}.m{color:var(--mu);font-size:13px}
.r{display:flex;justify-content:space-between;align-items:center;gap:8px}
.b{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--bd)}.red{color:var(--rd)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd)}
nav button{flex:1;background:none;color:var(--mu);border-radius:0;padding:14px 2px;font-size:12px}nav button.a{color:var(--pr);font-weight:700}
#t{position:fixed;top:10px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 16px;border-radius:10px;display:none;z-index:9}
.mo{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;padding:14px;z-index:8}
.mo .c{width:100%;max-width:380px;margin:0;max-height:92vh;overflow:auto}.rt{text-align:center;border-bottom:1px dashed var(--bd);padding-bottom:8px;margin-bottom:8px}
@media print{.print-logo{display:block!important;width:72px!important;height:72px!important;margin:0 auto 6px!important} body>*:not(#rm){display:none!important}.np{display:none!important}.mo{position:static;background:none}body{background:#fff;color:#000}.c{box-shadow:none}}
.lg{display:block;margin:0 auto 8px;max-width:210px;width:70%;background:#fff;border-radius:12px;padding:6px}.em{width:34px;height:34px;border-radius:50%;background:#fff;vertical-align:middle;margin-right:8px}
</style></head><body><div id="t"></div><div class="w" id="app"></div>
<script>
const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const M=n=>'₹'+Number(n||0).toLocaleString('en-IN');
let sb,me,D={},tab='home';
function toast(m){const t=$('#t');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2600)}
function ls(k,v){try{return v===undefined?localStorage.getItem(k):localStorage.setItem(k,v)}catch(e){return window['_'+k]=v===undefined?window['_'+k]:v}}
function init(){const u=ls('sbu')||'https://pkzvjolwirzwdwojjxcv.supabase.co',k=ls('sbk')||'sb_publishable_fFxoue-JndcHtXyNonOJdQ_KrfQ-0Lo';if(!u||!k)return setup();
 try{sb=supabase.createClient(u,k)}catch(e){return setup()}
 sb.auth.getSession().then(({data})=>data.session?boot():login())}
function setup(){$('#app').innerHTML=`<div class="c"><h2>Supabase Setup</h2><p class="m">Supabase → Project Settings → API nundi Project URL, anon public key (service_role vaddu!)</p>
<label>Project URL</label><input id="u" placeholder="https://xxxx.supabase.co"><label>Anon public key</label><input id="k" placeholder="eyJ...">
<button onclick="ls('sbu',$('#u').value.trim());ls('sbk',$('#k').value.trim());init()">Save</button></div>`}
function login(){$('#app').innerHTML=`<div class="c"><img class="lg" src="icon.png" alt="Rithvika Micro Finance"><label>Email</label><input id="e" type="email"><label>Password</label><input id="p" type="password">
<label>Full name (sign up ki matrame)</label><input id="n">
<div class="r"><button onclick="auth(0)">Login</button><button class="s" onclick="auth(1)">Sign up</button></div>
<p class="m"><a href="#" onclick="ls('sbu','');ls('sbk','');setup()">Change Supabase keys</a> · <a href="#" onclick="setLang(LANG=='te'?'en':'te');return false">🌐 తెలుగు / English</a></p></div>`}
async function auth(su){const email=$('#e').value.trim(),password=$('#p').value;
 const r=su?await sb.auth.signUp({email,password,options:{data:{full_name:$('#n').value.trim()}}}):await sb.auth.signInWithPassword({email,password});
 if(r.error)return toast(r.error.message);
 if(su&&!r.data.session)return toast('Email confirm cheyyandi, tarvata login avvandi');boot()}
async function boot(){
 const {data:{user}}=await sb.auth.getUser();
 const p=await sb.from('profiles').select('*').eq('id',user.id).single();
 if(p.error)return toast(p.error.message);me=p.data;
 if(!me.is_active){await sb.auth.signOut();login();return toast('Account inactive')}
 await load();render()}
async function load(){
 const [c,l,o,p]=await Promise.all([sb.from('customers').select('*').order('created_at',{ascending:false}),
 sb.from('loans').select('*').order('created_at',{ascending:false}),
 sb.from('collections').select('*').order('created_at',{ascending:false}),
 sb.from('profiles').select('*')]);
 [c,l,o,p].forEach(x=>x.error&&toast(x.error.message));
 D={cust:c.data||[],loans:l.data||[],cols:o.data||[],prof:p.data||[]};
 D.paid={};D.cols.forEach(x=>D.paid[x.loan_id]=(D.paid[x.loan_id]||0)+Number(x.amount));
 D.cn=Object.fromEntries(D.cust.map(x=>[x.id,x]));D.pn=Object.fromEntries(D.prof.map(x=>[x.id,x.full_name||'—']))}
const adm=()=>me.role==='admin',bal=l=>Number(l.repayment_total)-(D.paid[l.id]||0),today=()=>new Date().toISOString().slice(0,10);
function render(){
 const tabs=[['home','Home'],['coll','Collect'],['loans','Loans'],['cust','Customers'],['more','More']];
 $('#app').innerHTML=`<div class="r" style="margin-bottom:10px"><div><img class="em" src="icon.png" alt=""><b>${E(me.full_name||'User')}</b> <span class="b">${me.role}</span></div><button class="s sm" onclick="sb.auth.signOut().then(login)">Logout</button></div><div id="v"></div>
 <nav>${tabs.map(t=>`<button class="${t[0]==tab||(t[0]=='more'&&!tabs.some(x=>x[0]==tab))?'a':''}" onclick="tab='${t[0]}';render()">${t[1]}</button>`).join('')}</nav>`;
 ({home,coll,loans,cust,more,overdue,route,reports,staff,hand,exp,audit})[tab]()}
function tgt(p){const auto=D.loans.filter(l=>l.status==='active'&&l.assigned_staff===p.id).reduce((a,l)=>a+Number(l.daily_due),0);return Number(p.daily_target)>0?Number(p.daily_target):auto}
function got(p){return D.cols.filter(c=>c.collection_date===today()&&c.collected_by===p.id).reduce((a,c)=>a+Number(c.amount),0)}
function tbar(p){const t=tgt(p),g=got(p),pc=t?Math.min(100,Math.round(g/t*100)):0;return `<div style="margin:10px 0"><div class="r"><span>${E(p.full_name||'—')}</span><span><b>${M(g)}</b> / ${M(t)}</span></div><div style="height:8px;background:var(--bd);border-radius:9px;overflow:hidden;margin:4px 0"><div style="width:${pc}%;height:100%;background:var(--pr)"></div></div><div class="m">${pc}%${t&&g>=t?' ✅ target complete':''}</div></div>`}
function setT(id){const v=prompt('Daily target amount (0 = auto, assigned loans due total)');if(v===null)return;upd(id,{daily_target:Number(v)||0})}
function home(){const act=D.loans.filter(l=>l.status==='active'),td=D.cols.filter(c=>c.collection_date===today()).reduce((a,c)=>a+Number(c.amount),0),
 due=act.reduce((a,l)=>a+Number(l.daily_due),0),out=act.reduce((a,l)=>a+bal(l),0);
 $('#v').innerHTML=`<div class="g"><div class="c"><div class="m">Today collected</div><div class="k">${M(td)}</div></div><div class="c"><div class="m">Today target</div><div class="k">${M(due)}</div></div>
 <div class="c"><div class="m">Active loans</div><div class="k">${act.length}</div></div><div class="c"><div class="m">Outstanding</div><div class="k">${M(out)}</div></div></div>
 <div class="c"><h3>Today target</h3>${(adm()?D.prof.filter(p=>p.is_active):[me]).map(tbar).join('')||'<p class="m">No staff</p>'}</div>
 <div class="c"><h3>Recent collections</h3>${D.cols.slice(0,8).map(c=>`<div class="r"><span>${E(D.cn[c.customer_id]?.full_name)}<div class="m">${c.collection_date} · ${E(c.receipt_no)}</div></span><b>${M(c.amount)}</b></div><hr style="border:0;border-top:1px solid var(--bd)">`).join('')||'<p class="m">No collections yet</p>'}</div>`}
function coll(){const act=D.loans.filter(l=>l.status==='active');
 $('#v').innerHTML=`<div class="c"><h2>New collection</h2><label>Search customer</label><input id="cs2" placeholder="🔍 name / phone / code" oninput="fo()"><label>Loan</label><select id="cl" onchange="$('#ca').value=D.loans.find(l=>l.id==this.value)?.daily_due||''">
 </select>
 <label>Amount</label><input id="ca" type="number" value="${act[0]?.daily_due||''}"><label>Payment mode (customer ela icharu)</label><select id="cm"><option value="cash">Cash</option><option value="upi">UPI</option></select><label>Notes</label><input id="cn"><button onclick="addCol()">Save collection</button></div>
 <div class="c"><h3>All collections</h3>${D.cols.slice(0,30).map(c=>`<div class="r"><span>${E(D.cn[c.customer_id]?.full_name)}<div class="m">${c.collection_date} · ${(c.payment_mode||'cash').toUpperCase()} · ${E(D.pn[c.collected_by])}</div></span><span><b>${M(c.amount)}</b> <button class="s sm" onclick="rcpt('${c.id}')">Bill</button>${adm()?` <button class="s sm" onclick="del('collections','${c.id}')">✕</button>`:''}</span></div>`).join('')}</div>`;fo()}
function fo(){const q=($('#cs2')?.value||'').toLowerCase(),s=$('#cl');const a=D.loans.filter(l=>{const c=D.cn[l.customer_id]||{};return l.status==='active'&&(!q||[c.full_name,c.phone,c.customer_code,c.area].join(' ').toLowerCase().includes(q))}).slice(0,50);
 s.innerHTML=a.map(l=>`<option value="${l.id}">${E(D.cn[l.customer_id]?.full_name)} — due ${M(l.daily_due)} · bal ${M(bal(l))}</option>`).join('')||'<option value="">No match</option>';$('#ca').value=a[0]?.daily_due||''}
let busy=0;async function addCol(){if(busy)return;busy=1;setTimeout(()=>busy=0,4000);const l=D.loans.find(x=>x.id==$('#cl').value);if(!l)return;const a=Number($('#ca').value);if(!(a>0))return toast('Amount enter cheyyandi');
 const r=await sb.from('collections').insert({loan_id:l.id,customer_id:l.customer_id,collected_by:me.id,amount:a,notes:$('#cn').value||null,payment_mode:$('#cm').value,receipt_no:'R'+Date.now()}).select().single();
 if(r.error)return toast(r.error.message);
 if(D.paid[l.id]+a>=l.repayment_total&&adm())await sb.from('loans').update({status:'completed'}).eq('id',l.id);
 toast('Saved');await load();render();rcpt(r.data.id)}
function rcpt(id){const c=D.cols.find(x=>x.id==id),l=D.loans.find(x=>x.id==c.loan_id),cu=D.cn[c.customer_id]||{};
 const paid=D.cols.filter(x=>x.loan_id==c.loan_id&&x.created_at<=c.created_at).reduce((a,x)=>a+Number(x.amount),0),b=Number(l.repayment_total)-paid,by=D.pn[c.collected_by]||'';
 window.R={cu,txt:`*Rithvika Micro Finance*\nReceipt: ${c.receipt_no}\nDate: ${c.collection_date}\nCustomer: ${cu.full_name}\nAmount paid: ${M(c.amount)}\nPaid by: ${(c.payment_mode||'cash').toUpperCase()}\nBalance: ${M(b)}\nCollected by: ${by}\nThank you!`};
 const d=document.createElement('div');d.id='rm';d.className='mo';
 d.innerHTML=`<div class="c"><div class="rt"><img class="lg" src="icon.png" alt=""><div class="m">Payment Receipt</div></div>
 <div class="r"><span class="m">Receipt no</span><b>${E(c.receipt_no)}</b></div><div class="r"><span class="m">Date</span><b>${c.collection_date}</b></div>
 <div class="r"><span class="m">Customer</span><b>${E(cu.full_name)}</b></div><div class="r"><span class="m">Phone</span><b>${E(cu.phone||'')}</b></div>
 <div class="r"><span class="m">Loan total</span><b>${M(l.repayment_total)}</b></div><div class="r"><span class="m">Amount paid</span><b class="k">${M(c.amount)}</b></div><div class="r"><span class="m">Payment mode</span><b>${(c.payment_mode||'cash').toUpperCase()}</b></div>
 <div class="r"><span class="m">Balance</span><b>${M(b)}</b></div><div class="r"><span class="m">Collected by</span><b>${E(by)}</b></div>
 <p class="m" style="text-align:center">Thank you!</p>
 <div class="r np"><button onclick="waShare()">WhatsApp</button><button class="s" onclick="window.print()">Print</button><button class="s" onclick="$('#rm').remove()">Close</button></div></div>`;
 document.body.appendChild(d)}
function waShare(){let p=(R.cu.phone||'').replace(/\D/g,'');if(p.length==10)p='91'+p;window.open('https://wa.me/'+p+'?text='+encodeURIComponent(R.txt),'_blank')}
function loans(){$('#v').innerHTML=(adm()?`<div class="c"><h2>New loan</h2><label>Customer</label><select id="lc">${D.cust.map(c=>`<option value="${c.id}">${E(c.full_name)}</option>`).join('')}</select>
 <label>Type</label><select id="lt"><option>new</option><option>repeat</option></select><div class="g"><div><label>Principal</label><input id="lp" type="number"></div><div><label>Repayment total</label><input id="lr" type="number"></div>
 <div><label>Days</label><input id="ld" type="number" value="100"></div><div><label>Date</label><input id="ldt" type="date" value="${today()}"></div></div><label>Loan customer ki ela icharu</label><select id="lm"><option value="cash">Cash</option><option value="upi">UPI</option></select><button onclick="addLoan()">Create loan</button></div>`:'')+
 `<input id="q2" placeholder="🔍 Search customer name / phone / code" oninput="fl()"><div id="ll"></div>`;fl()}
function fl(){const q=($('#q2')?.value||'').toLowerCase();let a=D.loans.filter(l=>{const c=D.cn[l.customer_id]||{};return !q||[c.full_name,c.phone,c.customer_code,c.area,l.status].join(' ').toLowerCase().includes(q)});const n=a.length;a=a.slice(0,50);
 $('#ll').innerHTML=`<p class="m">${n} loans${n>50?' (first 50 matches)':''}</p>`+a.map(l=>`<div class="c"><div class="r"><b>${E(D.cn[l.customer_id]?.full_name)}</b><span class="b">${l.status}</span></div>
 <div class="m">${l.loan_type} · ${l.loan_date} · ${l.repayment_days} days · given ${(l.disbursed_mode||'cash').toUpperCase()}</div><div class="g" style="margin-top:6px"><span>Principal ${M(l.principal)}</span><span>Total ${M(l.repayment_total)}</span><span>Daily ${M(l.daily_due)}</span><span class="${bal(l)>0?'red':''}">Balance ${M(bal(l))}</span></div>
 ${l.status==='completed'?`<button class="s sm" style="margin-top:8px" onclick="nodue('${l.id}')">No-Due</button> ${adm()?`<button class="s sm" style="margin-top:8px" onclick="renew('${l.id}')">Repeat loan</button>`:''}`:''}${adm()&&l.status==='active'?`<button class="s sm" style="margin-top:8px" onclick="cancelLoan('${l.id}')">Cancel loan</button>`:''}</div>`).join('')}
async function addLoan(){const c=D.cust.find(x=>x.id==$('#lc').value),p=+$('#lp').value,t=+$('#lr').value,d=+$('#ld').value||100;if(!c||!(p>0)||!(t>0))return toast('Details fill cheyyandi');
 const r=await sb.from('loans').insert({customer_id:c.id,loan_type:$('#lt').value,principal:p,repayment_total:t,repayment_days:d,daily_due:Math.round(t/d*100)/100,loan_date:$('#ldt').value,disbursed_mode:$('#lm').value,created_by:me.id,assigned_staff:c.assigned_staff});
 r.error?toast(r.error.message):(toast('Loan created'),load().then(render))}
async function cancelLoan(id){if(!confirm('Cancel this loan?'))return;await sb.from('loans').update({status:'cancelled'}).eq('id',id);await load();render()}
function cust(){$('#v').innerHTML=(adm()?`<div class="c"><h2>Add customer</h2><label>Code</label><input id="cc"><label>Name</label><input id="cf"><label>Phone</label><input id="cp" type="tel"><label>Address</label><input id="ca2"><label>Area</label><input id="car">
 <label>Assigned staff</label><select id="cs">${D.prof.filter(p=>p.is_active).map(p=>`<option value="${p.id}">${E(p.full_name||p.id.slice(0,6))} (${p.role})</option>`).join('')}</select><button onclick="addCust()">Add</button></div><div class="c"><h3>Import customers (CSV)</h3><p class="m">Columns: customer_code, full_name, phone, address, area, staff_name (optional)</p><button class="s sm" onclick="tpl()">Sample CSV</button><label style="display:block;margin-top:8px">Default staff</label><select id="is">${stf()}</select><input type="file" id="if" accept=".csv,text/csv"><button onclick="imp()">Import</button></div>`:'')+
 `<input id="q" placeholder="🔍 Search name / phone / code / area" oninput="fc()"><div id="cl2"></div>`;fc()}
function fc(){const q=($('#q')?.value||'').toLowerCase();let a=D.cust.filter(c=>!q||[c.full_name,c.phone,c.customer_code,c.area,c.address].join(' ').toLowerCase().includes(q));const n=a.length;a=a.slice(0,50);
 $('#cl2').innerHTML=`<p class="m">${n} customers${n>50?' (first 50 matches, search cheyyandi)':''}</p>`+a.map(c=>`<div class="c"><div class="r"><b>${E(c.full_name)}</b><span class="b">${E(c.customer_code||'')}</span></div><div class="m">${E(c.phone||'')} · ${E(c.area||'')} · ${E(c.address||'')}</div><div class="m">Staff: ${E(D.pn[c.assigned_staff]||'—')}</div>
 <button class="s sm" style="margin-top:6px" onclick="ledger('${c.id}')">Ledger</button> ${adm()?`<button class="s sm" style="margin-top:6px" onclick="editC('${c.id}')">Edit</button> <button class="s sm" style="margin-top:6px" onclick="del('customers','${c.id}')">Delete</button>`:''}</div>`).join('')}
const stf=sel=>D.prof.filter(p=>p.is_active||p.id==sel).map(p=>`<option value="${p.id}" ${p.id==sel?'selected':''}>${E(p.full_name||p.id.slice(0,6))}</option>`).join('');
function editC(id){const c=D.cust.find(x=>x.id==id),d=document.createElement('div');d.id='em';d.className='mo';
 d.innerHTML=`<div class="c"><h2>Edit customer</h2><label>Code</label><input id="ec" value="${E(c.customer_code||'')}"><label>Name</label><input id="en" value="${E(c.full_name)}"><label>Phone</label><input id="ep" value="${E(c.phone||'')}"><label>Address</label><input id="ea" value="${E(c.address||'')}"><label>Area</label><input id="er" value="${E(c.area||'')}"><label>Staff</label><select id="es">${stf(c.assigned_staff)}</select><div class="r"><button onclick="saveC('${id}')">Save</button><button class="s" onclick="$('#em').remove()">Cancel</button></div></div>`;document.body.appendChild(d)}
async function saveC(id){const c=D.cust.find(x=>x.id==id),st=$('#es').value,nm=$('#en').value.trim();if(!nm)return toast('Name enter cheyyandi');
 const r=await sb.from('customers').update({customer_code:$('#ec').value.trim()||null,full_name:nm,phone:$('#ep').value||null,address:$('#ea').value||null,area:$('#er').value||null,assigned_staff:st}).eq('id',id);
 if(r.error)return toast(r.error.message);
 if(st!==c.assigned_staff){const r2=await sb.from('loans').update({assigned_staff:st}).eq('customer_id',id);if(r2.error)toast(r2.error.message)}
 $('#em').remove();toast('Updated');await load();render()}
function tpl(){csv('customers_sample.csv',[['customer_code','full_name','phone','address','area','staff_name'],['C100','Sample Name','9999999999','Village','Area1','Staff Name']])}
function pcsv(t){const rows=[];let r=[],v='',q=0;t=t.replace(/^\ufeff/,'');for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch=='"'){if(t[i+1]=='"'){v+='"';i++}else q=0}else v+=ch}else if(ch=='"')q=1;else if(ch==','){r.push(v);v=''}else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;r.push(v);v='';rows.push(r);r=[]}else v+=ch}if(v||r.length){r.push(v);rows.push(r)}return rows.filter(x=>x.some(y=>y.trim()))}
async function imp(){const f=$('#if').files[0];if(!f)return toast('CSV file select cheyyandi');const rows=pcsv(await f.text());const h=(rows.shift()||[]).map(x=>x.trim().toLowerCase()),ix=k=>h.indexOf(k);
 const byN=Object.fromEntries(D.prof.map(p=>[(p.full_name||'').trim().toLowerCase(),p.id]));
 const out=rows.map(r=>{const g=k=>ix(k)>=0?(r[ix(k)]||'').trim():'',nm=g('full_name');if(!nm)return null;return{customer_code:g('customer_code')||null,full_name:nm,phone:g('phone')||null,address:g('address')||null,area:g('area')||null,assigned_staff:byN[g('staff_name').toLowerCase()]||$('#is').value,created_by:me.id}}).filter(Boolean);
 if(!out.length)return toast('Rows levu, header check cheyyandi');if(!confirm(out.length+' customers import cheyyala?'))return;

const PT=[[/^Principal (.+)$/,'అసలు $1'],[/^Total (.+)$/,'మొత్తం $1'],[/^Daily (.+)$/,'రోజువారీ $1'],[/^Balance (.+)$/,'బాకీ $1'],[/^(\d+) customers · (.+) overdue$/,'$1 కస్టమర్లు · $2 బాకీ'],[/^(\d+) customers/,'$1 కస్టమర్లు'],[/^(\d+) loans/,'$1 అప్పులు'],[/^(\d+)\/(\d+) paid today$/,'ఈరోజు $1/$2 చెల్లించారు'],[/^Pending on (.+) \((\d+)\)$/,'$1 నాడు పెండింగ్ ($2)'],[/^(\d+) days · /,'$1 రోజులు · '],[/^Staff: /,'సిబ్బంది: '],[/^Target: Auto/,'లక్ష్యం: ఆటో'],[/^Target: /,'లక్ష్యం: '],[/ — due (.*) · bal (.*)$/,' — రోజువారీ $1 · బాకీ $2'],[/^Net profit (.+)$/,'నికర లాభం $1'],[/^Expenses \((.+)\)$/,'ఖర్చులు ($1)'],[/^Already handed today: (.+)$/,'ఈరోజు అప్పగించినది: $1']];
let LANG=ls('lang')||'en';
function trn(n){if(n.nodeType==3){const v=n.nodeValue,t=v.trim();if(!t)return;let r=TE[t];if(!r)for(const [re,x] of PT)if(re.test(t)){r=t.replace(re,x);break}if(r)n.nodeValue=v.replace(t,r)}else if(n.nodeType==1){if(n.placeholder&&TE[n.placeholder])n.placeholder=TE[n.placeholder];n.childNodes.forEach(trn)}}
new MutationObserver(m=>{if(LANG==='te')m.forEach(x=>x.addedNodes.forEach(trn))}).observe(document.body,{childList:true,subtree:true});
function setLang(l){LANG=l;ls('lang',l);document.querySelector('nav')?render():login()}
